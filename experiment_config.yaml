python_version: "3.12.13"
os: win32 (Windows)
source: "Unduh PDF resmi peraturan.go.id (deviasi plan Bab 2/8: repo GitHub tidak memuat data)"

jumlah_dokumen: 11
data_selected: "data/selected/document_manifest.csv"
metadata: "data/selected/metadata.json"
markdown: "data/selected/markdown/"

splitter: "RecursiveCharacterTextSplitter"
length_function: "karakter (len)"
separators:
  - "\n\nBAB "
  - "\n\nBagian "
  - "\n\n### "
  - "\n\n## "
  - "\n\nPasal "
  - "\n\n"
  - "\n"
  - " "
  - ""
baseline_a:
  chunk_size: 500
  chunk_overlap: 100
  chunks: 4725
  file: "data/processed/chunks_a.jsonl"
baseline_b:
  chunk_size: 700
  chunk_overlap: 150
  chunks: 3456
  file: "data/processed/chunks.jsonl"

embedding_model: "intfloat/multilingual-e5-base"
embedding_dimension: 768
embedding_prefix: { document: "passage: ", query: "query: " }
embedding_note: "dipilih Anggota 2 (plan Bab 6.2): CPU-only, 278M param, ukuran wajar, kualitas Bahasa Indonesia; bge-m3 ditolak karena lambat di CPU. Throughput ~11.6 chunk/s -> 3456 chunk ~5 menit."

vector_db: "chroma"
vectorstore_dir: "vectorstore/chroma"
collection: "rag_ketenagakerjaan"
hnsw_space: "cosine"
chunk_baseline_indexed: "b"   # data/processed/chunks.jsonl (700/150, 3456 chunk)

top_k: 5

retrieval_metrics:
  metric: "Recall@k (document-level)"
  k: 5
  total_questions: 20
  in_domain_questions: 17
  recall_at_5: 1.0
  mean_recall_support: 0.7647
  results_file: "evaluation/retrieval_results.json"

llm: "Gemini 2.5 Flash"
temperature: 0-0.2